name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only deps)
        run: pip install -e ".[data,dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest
      - name: Validate handcrafted benchmark
        run: python scripts/build_handcrafted_benchmark.py
