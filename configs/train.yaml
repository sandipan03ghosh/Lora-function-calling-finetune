# Training config. Every run is reproducible from this file alone.
# Runs in Colab (T4 GPU):  python -m ftpipe.cli train --config configs/train.yaml

experiment_name: function-calling-lora

model: unsloth/Llama-3.2-3B-Instruct           # un-gated mirror of meta-llama/Llama-3.2-3B-Instruct
model_4bit: unsloth/Llama-3.2-3B-Instruct-bnb-4bit
use_unsloth: true
max_seq_length: 2048

# LoRA (Project-10 baseline: attention projections, rank 16, alpha = 2x rank, dropout 0.05)
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, v_proj]

# optimisation
lr: 0.0002
epochs: 3
batch_size: 8
grad_accum: 2
warmup_ratio: 0.05
weight_decay: 0.01
max_steps: null                 # null -> train for `epochs`; set an int to cap steps
train_subset: null              # null -> use the full train split

# checkpointing / early stopping
eval_steps: 25
save_steps: 25
early_stopping_patience: 3
val_eval_n: 100                 # quick task-metric eval after training

seed: 42
processed_dir: data/processed
output_dir: outputs/final
run_name: final

# Llama 3.x chat markers used for completion-only loss (only the answer is trained on)
instruction_part: "<|start_header_id|>user<|end_header_id|>\n\n"
response_part: "<|start_header_id|>assistant<|end_header_id|>\n\n"

# hyperparameter sweep: 6 runs on a fast profile (Project 10 asks for >= 3).
# Vary rank with lr/epochs fixed, then vary lr, then one longer run.
sweep_max_steps: 120
sweep_max_examples: 800
sweep:
  - {lora_r: 8,  lr: 0.0002, epochs: 1}
  - {lora_r: 16, lr: 0.0002, epochs: 1}
  - {lora_r: 32, lr: 0.0002, epochs: 1}
  - {lora_r: 16, lr: 0.0001, epochs: 1}
  - {lora_r: 16, lr: 0.0005, epochs: 1}
  - {lora_r: 16, lr: 0.0002, epochs: 3}
