# Evaluation config. Runs in Colab / Kaggle:
#   python -m ftpipe.cli evaluate --config configs/eval.yaml --base <model> [--adapter <path>] --tag <base|finetuned>

benchmarks:
  - data/processed/test_id.jsonl      # in-distribution held-out test
  - data/processed/test_ood.jsonl     # APIs whose tool names were held out of training
  - data/benchmark/handcrafted.jsonl  # hand-written edge cases

max_new_tokens: 512
batch_size: 8
seed: 42
output_dir: outputs/eval

judge:
  provider: gemini                    # none | anthropic | openai | gemini  (set the matching key as a secret)
  # lite tier: established models 404 for new keys, and the newest ones have tiny free quotas
  model: gemini-flash-lite-latest
  n_examples: 20

forgetting:
  arc_n: 100
  hellaswag_n: 100
