[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ftpipe"
version = "0.1.0"
description = "Reproducible QLoRA fine-tuning pipeline: a small function-calling model for agent tool-use"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# CPU-friendly: dataset build + evaluation scoring. Runs on a laptop or a Colab/Kaggle CPU runtime.
data = ["datasets>=3.0"]
# Model loading / serving. With no GPU, only `serve` on CPU is practical (slow, but works).
serve = [
    "fastapi>=0.118",
    "starlette>=0.49.1",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.29",
    "h11>=0.16",
    "transformers>=4.51",
    "peft>=0.12",
    "torch>=2.6",
    "accelerate>=0.33",
    "bitsandbytes>=0.50",
]
judge = ["anthropic>=1.5.0", "openai>=3.13.0", "google-genai>=2.23.0,<3.0.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ftpipe = "ftpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: requires a CUDA GPU (skipped in CI)",
    "network: requires network / model downloads (skipped in CI)",
]
